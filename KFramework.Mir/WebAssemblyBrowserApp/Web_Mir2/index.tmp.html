  <style>
    :root {
      --bg: #07090d;
      --panel: #11151d;
      --border: #232a36;
      --text: #c9d3e0;
      --dim: #6b7686;
      --accent: #d8a34a;
      --ok: #4ec97a;
      --warn: #e0b155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 700px at 50% -10%, #16202e 0%, var(--bg) 60%);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .sub { margin: 0 0 20px; color: var(--dim); font-size: 12px; letter-spacing: 1px; }

    .stage {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
      background: #0b0e14;
      line-height: 0;
    }

    canvas {
      display: block;
      width: 1024px;
      height: 768px;
      max-width: calc(100vw - 32px);
      image-rendering: pixelated;
      cursor: grab;
    }

    canvas:active { cursor: grabbing; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0b0e14;
      color: var(--dim);
      letter-spacing: 1px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #panel {
      margin-top: 18px;
      width: 1024px;
      max-width: calc(100vw - 32px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .03);
    }

    .row > span:first-child {
      min-width: 150px;
      color: var(--dim);
      font-size: 12px;
    }

    .row b { color: var(--text); font-weight: 600; }
    .row .ok { color: var(--ok); }
    .row .warn { color: var(--warn); }

    .hint {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .5px;
    }
  </style>
</head>

<body>
  <h1>KFRAMEWORK.MIR</h1>
  <p class="sub">Legend of Mir 3 · WebGL · C# WebAssembly</p>

  <div class="stage">
    <canvas id="screen" width="1024" height="768"></canvas>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loadText">正在加载 .NET 运行时…</div>
    </div>
  </div>

  <div id="panel"></div>
</body>

</html>
