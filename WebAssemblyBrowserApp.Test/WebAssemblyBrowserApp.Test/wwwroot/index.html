<!DOCTYPE html>

<html>

<head>
  <title>WASM 基准测试总纲</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type='module' src="main#[.{fingerprint}].js"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 2rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    h2 { margin-top: 1.5rem; }
    h3 { margin: 0 0 .25rem; }
    .muted { color: #777; font-size: .85rem; margin: .25rem 0 .75rem; }
    #status { font-weight: 600; color: #0a7; }
    .card { background: #f7f7fa; border: 1px solid #e3e3e8; border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #e3e3e8; }
    th { background: #ececf2; }
    td:not(:first-child) { font-variant-numeric: tabular-nums; }

    /* 顶部工具条 */
    .bar { display: flex; gap: .5rem; align-items: center; margin: .5rem 0 1rem; }
    button { font: inherit; padding: .3rem .7rem; border: 1px solid #cfcfd8;
             background: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #eef; border-color: #9aa; }

    /* 总纲条目 */
    ol.menu { list-style: decimal; padding-left: 1.4rem; margin: .25rem 0; }
    ol.menu li { margin-bottom: .7rem; }
    ol.menu button.run { margin-right: .5rem; }
    ol.menu .muted { margin: .1rem 0 0; }
  </style>
</head>

<body>
  <h1>WASM 基准测试总纲</h1>
  <p class="muted">C# 反射 / 互操作（MemoryView、JS↔C# 跨界）性能测试。每个测试一个独立模块。</p>

  <div class="bar">
    <button id="runAll">运行全部</button>
    <button id="showMenu">回到总纲</button>
    <span id="status">加载中...</span>
  </div>

  <div id="results"><i>loading...</i></div>
</body>

</html>
