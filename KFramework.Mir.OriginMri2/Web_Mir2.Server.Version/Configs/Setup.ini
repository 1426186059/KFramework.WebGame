[General]
VersionPath=.\Mir2.Exe ; 客户端版本目录（相对服务端根目录）
CheckVersion=False ; 是否校验客户端版本号
RelogDelay=50 ; 断线后允许重新登录的延迟（秒）
GMPassword=C#Mir 4.0 ; GM 命令密码
Multithreaded=True ; 是否启用多线程处理
ThreadLimit=2 ; 工作线程数上限
TestServer=False ; 测试服模式（开启后部分限制放宽）
EnforceDBChecks=False ; 强制数据库完整性检查
MonsterProcessWhenAlone=False ; 无玩家在线时是否仍处理怪物逻辑
Language=Chinese ; 客户端默认语言
OpenServerDate= ; 开服日期（yyyy-MM-dd，用于按开服天数判断的特效/活动条件，留空全放行）

[Network]
IPAddress=127.0.0.1 ; 服务端监听 IP
Port=8000 ; 游戏服务端口
TimeOut=10000 ; 连接超时（毫秒）
MaxUser=50 ; 最大同时在线人数
MaxIP=5 ; 同一 IP 最大连接数
MaxPacket=50 ; 单帧最大处理封包数
StartHTTPService=False ; 是否启动内置 HTTP 服务
HTTPIPAddress=http://127.0.0.1:5679/ ; HTTP 服务对外地址
HTTPTrustedIPAddress=127.0.0.1 ; HTTP 信任 IP（白名单）

[Permission]
AllowNewAccount=True ; 是否允许注册新账号
AllowChangePassword=True ; 是否允许修改密码
AllowLogin=True ; 是否允许登录
AllowNewCharacter=True ; 是否允许创建角色
AllowDeleteCharacter=True ; 是否允许删除角色
AllowStartGame=False ; 是否允许进入游戏
AllowCreateAssassin=True ; 是否允许创建刺客职业
AllowCreateArcher=True ; 是否允许创建弓箭手职业
RequireStoragePassword=True ; 仓库是否需要密码
MaxResolution=1024 ; 客户端最大分辨率档位

[Optional]
SafeZoneBorder=True ; 安全区是否显示边界
SafeZoneHealing=False ; 安全区是否自动回血回蓝
GatherOrbsPerLevel=True ; 元素球是否按等级自动凝聚
ExpMobLevelDifference=True ; 怪物经验是否受等级差影响
GameMasterEffect=False ; GM 是否显示特殊光效
LineMessageTimer=10 ; 分线公告间隔（秒）

[Database]
SaveDelay=5 ; 玩家数据自动保存间隔（分钟）
CredxGold=30 ; 元宝兑换金币比例
ConfigBaseUrl=http://127.0.0.1:5082/ ; 配置表热更新下载地址

[Game]
DropRate=1 ; 全局掉落倍率
ExpRate=5 ; 全局经验倍率(打怪/任务/脚本统一乘)，1=原版曲线,5=加速5倍，与SExp叠加: 基础经验×ExpRate×(SExp>0?10:1)×组队倍率
ItemTimeOut=30 ; 地面物品存在时间（秒）
PlayerDiedItemTimeOut=120 ; 玩家死亡掉落物存在时间（秒）
PetSave=False ; 宝宝/宠物是否随角色存档
MaxBossTames=1 ; 最多可驯服 BOSS 数量
PKDelay=12 ; PK 后保护时间（秒）
MonsterRecallEnabled=True ; 是否允许召唤怪物
MonsterRecallRange=12 ; 召唤怪物生效范围（格）
MonsterRecallCooldown=5000 ; 召唤怪物冷却（毫秒）
NewbieGuild=NewbieGuild ; 新手行会名称
NewbieGuildMaxSize=1000 ; 新手行会人数上限
