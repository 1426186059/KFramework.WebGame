PKTownPositionX=848 ; PK 城复活点 X 坐标
PKTownPositionY=677 ; PK 城复活点 Y 坐标

[Birth]
; 新角色出生地图 ID（103 = 比奇省）
HomeMapIndex=103 ; 出生地图编号
; 出生安全区在该地图 StartPoint 列表中的序号（0=第一个/比奇城，1=第二个/新手村）
StartPointIndex=1 ; 出生点序号
; 新建角色初始金币（角色级，每角色独立，不通用）
NewCharacterGold=100000 ; 新建角色初始金币
NewCharacterSExp=99 ; 新建角色初始 10 倍经验点（打怪每消耗 1 点，本次经验 ×10）

[DropGold]
DropGold=True ; 死亡是否掉金币
