; ----- 基础属性配置：战士 -----
; 各属性段下 Formula / Base / Gain / GainRate / Max 含义：
;   Formula : 成长公式，Health(血量) / Mana(魔法) / Weight(负重) / Stat(线性)
;   Base    : 1级起始值
;   Gain    : 每 Gain 级 +1 点，实际值 Base 加 等级除 Gain（整数除法）
;   GainRate: 仅 Health / Mana 公式生效，Stat / Weight 忽略
;   Max     : 该属性按等级的上限，0 表示不封顶；另有 [Caps] 段做总封顶

; 物理防御下限（物防）
[MinAC]
Formula=Stat
Base=0
Gain=0
GainRate=0
Max=0

; 物理防御上限（物防）
[MaxAC]
Formula=Stat
Base=0
Gain=7
GainRate=0
Max=0

