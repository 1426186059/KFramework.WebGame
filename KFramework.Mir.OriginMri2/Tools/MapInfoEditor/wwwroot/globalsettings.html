<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全局设置 - MapInfoEditor</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #f4f6f9; color: #222; }
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1f2937; color: #fff; }
  #toolbar .title { font-weight: bold; font-size: 16px; }
  #toolbar .spacer { flex: 1; }
  #toolbar a.back { color: #fff; text-decoration: none; font-size: 13px; padding: 6px 10px; border: 1px solid #4b5563; border-radius: 6px; }
  #toolbar a.back:hover { background: #374151; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .gs-title { font-weight: bold; font-size: 15px; color: #1565ff; margin-bottom: 8px; }
  .gs-desc { color: #555; font-size: 13px; line-height: 1.6; margin: 0 0 14px; }
  .action { background: #1565ff; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .action:hover { background: #0d4ed6; }
  .action:disabled { background: #9bbcff; cursor: default; }
  .gs-result { margin-top: 16px; font-size: 13px; color: #333; }
  .gs-tbl { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12px; }
  .gs-tbl th, .gs-tbl td { border: 1px solid #ddd; padding: 4px 8px; text-align: center; }
  .gs-tbl th { background: #f0f0f0; }
</style>
</head>
<body>
<div id="toolbar">
  <span class="title">⚙ 全局设置</span>
  <span class="spacer"></span>
  <a class="back" href="/index.html">← 返回编辑器</a>
</div>

<div class="container">
  <div class="panel">
    <div class="gs-title">NPC 修复</div>
    <p class="gs-desc">扫描全部地图的 NPC，把落在不可走/越界坐标的 NPC 就近挪到最近的可走格子，并写回 NPCInfo.json（永久修复，避免每次启动再挪）。</p>
    <button id="fixNpcBtn" class="action">🔧 扫描并修复所有 NPC 不可走点</button>
    <div id="globalResult" class="gs-result"></div>
  </div>

  <div class="panel">
    <div class="gs-title">安全区修正</div>
    <p class="gs-desc">从原始地图 .dat（权威源）重新生成全部地图的安全区：取每个格的“安全区”标记，聚成连通分量后求最小朝向矩形，覆盖写入 MapInfo_Fix 的 SafeZones（写前自动备份为 MapInfo_Fix.json.bak）。无法解码（无 .dat 块或无配置宽高）的地图保持原样。</p>
    <button id="fixSafeBtn" class="action">🛡 修正所有地图安全区（从 .dat 重算）</button>
    <div id="safeResult" class="gs-result"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');

$('fixNpcBtn').onclick = async () => {
  const btn = $('fixNpcBtn');
  btn.disabled = true; $('globalResult').textContent = '扫描中...';
  try {
    const res = await fetch('/api/fixnpcs', { method: 'POST' });
    const j = await res.json();
    if (!res.ok) { $('globalResult').textContent = '失败: ' + (j.error || res.status); }
    else {
      let html = `扫描 ${j.scanned} 个 NPC，修复 ${j.fixed} 个` + (j.skippedNoMap ? `，跳过 ${j.skippedNoMap} 个（地图无网格数据）` : '') + '。';
      html += '<br/>修复已写回 NPCInfo.json，请在主编辑器刷新对应地图查看。';
      if (j.fixes && j.fixes.length) {
        html += '<table class="gs-tbl"><thead><tr><th>ID</th><th>名称</th><th>地图</th><th>原坐标</th><th>新坐标</th></tr></thead><tbody>' +
          j.fixes.map(f => `<tr><td>${f.index}</td><td>${esc(f.name)}</td><td>${f.mapIndex}</td><td>(${f.fromX},${f.fromY})</td><td>(${f.toX},${f.toY})</td></tr>`).join('') +
          '</tbody></table>';
      } else { html += ' 没有需要修复的 NPC。'; }
      $('globalResult').innerHTML = html;
    }
  } catch (e) { $('globalResult').textContent = '异常: ' + e.message; }
  finally { btn.disabled = false; }
};

$('fixSafeBtn').onclick = async () => {
  const btn = $('fixSafeBtn');
  btn.disabled = true; $('safeResult').textContent = '重算中...';
  try {
    const res = await fetch('/api/fixsafzones', { method: 'POST' });
    const j = await res.json();
    if (!res.ok) { $('safeResult').textContent = '失败: ' + (j.error || res.status); }
    else {
      let html = `处理 ${j.mapsProcessed} 张地图（跳过 ${j.skippedNoData} 张无数据），改写 ${j.mapsChanged} 张，生成 ${j.zonesCreated} 个安全区矩形。`;
      if (j.backup) html += `<br/>原文件已备份：${esc(j.backup)}`;
      $('safeResult').innerHTML = html;
    }
  } catch (e) { $('safeResult').textContent = '异常: ' + e.message; }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
