<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MapInfo 编辑器 (Web)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; }
  #toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #1f2937; color: #fff; }
  #toolbar select, #toolbar button { font-size: 13px; padding: 4px 8px; }
  #toolbar .spacer { flex: 1; }
  #toolbar .status { color: #9be29b; }
  #main { display: flex; height: calc(100% - 44px); }
  #left { width: 190px; border-right: 1px solid #ccc; display: flex; flex-direction: column; background: #fafafa; }
  #left input.filter { margin: 6px; padding: 5px; }
  #maplist { flex: 1; overflow: auto; margin: 0; padding: 0; list-style: none; }
  #maplist li { padding: 5px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
  #maplist li:hover { background: #eaf2ff; }
  #maplist li.active { background: #cfe4ff; font-weight: bold; }
  #maplist li .id { color: #888; font-size: 11px; }
  #mid { flex: 1; display: flex; flex-direction: column; min-width: 320px; }
  #tabs { display: flex; border-bottom: 1px solid #ccc; background: #eee; }
  #tabs button { border: none; background: transparent; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  #tabs button.active { background: #fff; font-weight: bold; border-bottom: 2px solid #1565ff; }
  .tabpane { flex: 1; overflow: auto; padding: 10px; display: none; }
  .tabpane.active { display: block; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ddd; padding: 3px 5px; text-align: center; }
  th { background: #f0f0f0; }
  input[type=number] { width: 64px; padding: 2px; }
  input[type=text] { width: 140px; padding: 2px; }
  .row { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .row .hint { color: #888; }
  .gfield { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .gfield label { width: 110px; display: inline-block; }
  #right { width: 38%; min-width: 300px; border-left: 1px solid #ccc; display: flex; flex-direction: column; background: #111; }
  #legend { padding: 6px 10px; color: #ddd; background: #222; font-size: 12px; line-height: 1.5; }
  #status { padding: 5px 10px; color: #ddd; background: #222; }
  #canvasWrap { flex: 1; overflow: auto; padding: 8px; }
  #canvas { image-rendering: pixelated; background: #000; display: block; }
  button.action { background: #1565ff; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
  button.del { background: #c0392b; color: #fff; border: none; padding: 2px 6px; cursor: pointer; }
  #monBody .monpick { background: #e3f2fd; border: 1px solid #90caf9; border-radius: 3px; padding: 3px 8px; cursor: pointer; text-align: left; min-width: 160px; font-size: 12px; }
  #monBody .monpick:hover { background: #d0e7fb; }
  #monPicker { position: fixed; z-index: 1000; width: 360px; max-height: 70vh; overflow: hidden; background: #fff; border: 1px solid #90caf9; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.3); padding: 6px; transform: translateY(-8px); opacity: 0; pointer-events: none; transition: transform .15s ease, opacity .15s ease; }
  #monPicker.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #monPicker .pick-head { padding: 6px 10px 8px; font-weight: bold; color: #555; border-bottom: 1px solid #eee; margin-bottom: 6px; font-size: 13px; }
  #monPicker .pick-item { display: block; width: 100%; text-align: left; border: none; background: #fff; padding: 8px 10px; cursor: pointer; border-radius: 4px; font-size: 13px; }
  #monPicker .pick-item:hover { background: #e3f2fd; }
  #mvBody .mvpick { background: #e3f2fd; border: 1px solid #90caf9; border-radius: 3px; padding: 3px 8px; cursor: pointer; text-align: left; min-width: 160px; font-size: 12px; }
  #mvBody .mvpick:hover { background: #d0e7fb; }
  #mvPicker { position: fixed; z-index: 1000; width: 360px; max-height: 70vh; overflow: hidden; background: #fff; border: 1px solid #90caf9; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.3); padding: 6px; transform: translateY(-8px); opacity: 0; pointer-events: none; transition: transform .15s ease, opacity .15s ease; }
  #mvPicker.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #mvPicker .pick-head { padding: 6px 10px 8px; font-weight: bold; color: #555; border-bottom: 1px solid #eee; margin-bottom: 6px; font-size: 13px; }
  #mvPicker .mv-item { display: block; width: 100%; text-align: left; border: none; background: #fff; padding: 8px 10px; cursor: pointer; border-radius: 4px; font-size: 13px; }
  #mvPicker .mv-item:hover { background: #e3f2fd; }
  .pick-search { display: flex; gap: 4px; padding: 4px 6px 6px; border-bottom: 1px solid #eee; margin-bottom: 4px; }
  .pick-input { flex: 1; min-width: 0; border: 1px solid #bbb; border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  .pick-go { border: 1px solid #90caf9; background: #e3f2fd; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .pick-go:hover { background: #d0e7fb; }
  .pick-list { max-height: calc(70vh - 70px); overflow-y: auto; }
  .pick-empty { padding: 10px; color: #999; text-align: center; font-size: 12px; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="saveBtn" class="action">💾 保存</button>
  <button id="srcBtn" class="action">📂 数据来源</button>
  <span class="spacer"></span>
  <span class="status" id="tbStatus"></span>
</div>

<div id="main">
  <div id="left">
    <input class="filter" id="filter" placeholder="过滤 id / 名称..." />
    <ul id="maplist"></ul>
  </div>

  <div id="mid">
    <div id="tabs">
      <button data-tab="general" class="active">常规</button>
      <button data-tab="sz">安全区</button>
      <button data-tab="mon">怪物刷新</button>
      <button data-tab="npc">NPC</button>
      <button data-tab="mv">传送点</button>
    </div>

    <div id="tab-general" class="tabpane active">
      <div class="gfield"><label>标题 Title</label><input type="text" id="g_title" /></div>
      <div class="gfield"><label>FileName</label><input type="text" id="g_fileName" /></div>
      <div class="gfield"><label>MiniMap</label><input type="number" id="g_miniMap" /></div>
      <div class="gfield"><label>BigMap</label><input type="number" id="g_bigMap" /></div>
      <div class="gfield"><label>Music</label><input type="number" id="g_music" /></div>
      <div class="gfield"><label>Light</label><input type="number" id="g_light" /></div>
      <div class="gfield"><label>NoReconnectMap</label><input type="text" id="g_noReconnectMap" /></div>
      <div id="g_bools" style="margin-top:10px"></div>
    </div>

    <div id="tab-sz" class="tabpane">
      <div class="row"><button class="action" id="addSZ">＋ 添加</button><span class="hint">新增安全区默认在图中心（半宽/半高10、不旋转），可手动修改</span></div>
      <table><thead><tr><th>X</th><th>Y</th><th>半宽X</th><th>半高Y</th><th>旋转°</th><th>出生点</th><th></th></tr></thead><tbody id="szBody"></tbody></table>
    </div>

    <div id="tab-mon" class="tabpane">
      <div class="row"><button class="action" id="addMon">＋ 添加</button><span class="hint">怪物名用下拉选择</span></div>
      <table><thead><tr><th>怪物</th><th>X</th><th>Y</th><th>数量</th><th>扩散</th><th>延迟</th><th>方向</th><th></th></tr></thead><tbody id="monBody"></tbody></table>
    </div>

    <div id="tab-npc" class="tabpane">
      <div class="row"><span class="hint">（只读）NPC 来自全局表 <b>NPCInfo</b>，请直接修改 NPCInfo 表后刷新页面即可生效。</span></div>
      <table><thead><tr><th>ID</th><th>脚本</th><th>名称</th><th>X</th><th>Y</th><th>频率</th><th>图像</th></tr></thead><tbody id="npcBody"></tbody></table>
    </div>

    <div id="tab-mv" class="tabpane">
      <div class="row"><button class="action" id="addMv">＋ 添加</button><span class="hint">新增传送点写入本图（源坐标默认图中心，可手动修改）</span></div>
      <table><thead><tr><th>目标地图</th><th>源X</th><th>源Y</th><th>目标X</th><th>目标Y</th><th>NeedHole</th><th>NeedMove</th><th></th></tr></thead><tbody id="mvBody"></tbody></table>
    </div>
  </div>

  <div id="right">
    <div id="legend">
      图例：<span style="color:#ebe8de">■</span>可走 &nbsp; <span style="color:#404040">■</span>墙(不可走) &nbsp;
      <span style="color:#00cc00">□</span>安全区(亮绿=出生点) &nbsp; <span style="color:#ff2222">●</span>怪物 &nbsp;
      <span style="color:#1565ff">○</span>Boss &nbsp; <span style="color:#00aa00">●</span>NPC &nbsp;
      <span style="color:#ff9900">■</span>传送点(源)
    </div>
    <div id="status">就绪</div>
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
  </div>
</div>

<div id="monPicker"></div>
<div id="mvPicker"></div>
<script>
const $ = id => document.getElementById(id);
let maps = [], monsters = [];
let current = null;       // 当前地图详情
let flags = null;         // Uint8Array 解码后的 nibble 数据
let cellPx = 4;

const BOOL_FIELDS = [
  ['noTeleport','NoTeleport'], ['noReconnect','NoReconnect'], ['noRecall','NoRecall'],
  ['noDrug','NoDrug'], ['noFight','NoFight'], ['noDropMonster','NoDropMonster'],
  ['noNames','NoNames'], ['noMount','NoMount'], ['noGroup','NoGroup'],
  ['requiredGroup','RequiredGroup'], ['fight','Fight'], ['fire','Fire'],
  ['noTownTeleport','NoTownTeleport'], ['gt','GT']
];

function b64ToBytes(b64) {
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function setStatus(t) { $('status').textContent = t; }
function setTb(t) { $('tbStatus').textContent = t; }

async function init() {
  const [mRes, monRes] = await Promise.all([fetch('/api/maps'), fetch('/api/monsters')]);
  const m = await mRes.json(); maps = m.maps;
  const mo = await monRes.json(); monsters = mo.monsters;

  $('saveBtn').onclick = save;
  $('srcBtn').onclick = () => window.open('/sources.html', '_blank');

  buildBoolFields();
  renderList('');
  wireTabs();
  wireTables();
  setTb(`已加载 ${maps.length} 张地图 / ${monsters.length} 个怪物`);
}

function buildBoolFields() {
  const box = $('g_bools');
  box.innerHTML = '';
  BOOL_FIELDS.forEach(([k, label]) => {
    const id = 'g_' + k;
    const wrap = document.createElement('div');
    wrap.className = 'gfield';
    wrap.innerHTML = `<label>${label}</label><input type="checkbox" id="${id}" />`;
    box.appendChild(wrap);
  });
}

function renderList(filter) {
  const f = (filter || '').trim().toLowerCase();
  const ul = $('maplist'); ul.innerHTML = '';
  maps.forEach(m => {
    if (f && !(`${m.index}`.includes(f)) && !m.title.toLowerCase().includes(f) && !m.fileName.toLowerCase().includes(f)) return;
    const li = document.createElement('li');
    li.dataset.id = m.index;
    li.innerHTML = `<span class="id">[${m.index}]</span> ${m.title || m.fileName}`;
    if (current && current.index === m.index) li.classList.add('active');
    li.onclick = () => selectMap(m.index);
    ul.appendChild(li);
  });
}

async function selectMap(id) {
  setStatus('加载中...');
  const res = await fetch('/api/maps/' + id);
  if (!res.ok) { setStatus('加载失败: ' + (await res.text())); return; }
  current = await res.json();
  if (!current.npcs) current.npcs = [];
  if (!current.movements) current.movements = [];
  flags = current.map.flagsBase64 ? b64ToBytes(current.map.flagsBase64) : null;
  cellPx = Math.max(1, Math.floor(560 / Math.max(current.map.cols || 1, current.map.rows || 1)));
  renderList($('filter').value);
  renderGeneral();
  renderSZ(); renderMon(); renderNpc(); renderMv();
  drawMap();
  setStatus(`已加载：${current.title || current.fileName} (id=${current.index})`);
}

async function reloadMap() { await selectMap(current.index); }

function renderGeneral() {
  const g = current.general;
  $('g_title').value = g.title || '';
  $('g_fileName').value = g.fileName || '';
  $('g_miniMap').value = g.miniMap || 0;
  $('g_bigMap').value = g.bigMap || 0;
  $('g_music').value = g.music || 0;
  $('g_light').value = g.light || 0;
  $('g_noReconnectMap').value = g.noReconnectMap || '';
  BOOL_FIELDS.forEach(([k]) => { $('g_' + k).checked = !!g[k]; });
}

function wireTabs() {
  document.querySelectorAll('#tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tabpane').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      $('tab-' + b.dataset.tab).classList.add('active');
    };
  });
}

function wireTables() {
  // 安全区
  $('addSZ').onclick = () => { current.safeZones.push({ x: Math.floor(current.map.cols/2), y: Math.floor(current.map.rows/2), size: 10, sizeY: 10, rotation: 0, start: false }); renderSZ(); drawMap(); };
  // 怪物
  $('addMon').onclick = () => { const mi = monsters.length ? monsters[0].index : 0; current.respawns.push({ monsterIndex: mi, x: Math.floor(current.map.cols/2), y: Math.floor(current.map.rows/2), count: 1, spread: 0, delay: 0, direction: 0 }); renderMon(); drawMap(); };
  // 传送点
  $('addMv').onclick = () => { current.movements.push({ destMapIndex: current.index, sourceX: Math.floor(current.map.cols/2), sourceY: Math.floor(current.map.rows/2), destX: 0, destY: 0, needHole: false, needMove: false }); renderMv(); drawMap(); };
  // 委托编辑（安全区/怪物/传送点：本地修改，保存时随地图一起写入 MapInfo_Fix）
  bindBody('szBody', current => current.safeZones, ['x','y','size','sizeY','rotation'], ['start']);
  bindBody('monBody', current => current.respawns, ['monsterIndex','x','y','count','spread','delay','direction'], []);
  bindBody('mvBody', current => current.movements, ['destMapIndex','sourceX','sourceY','destX','destY'], ['needHole','needMove']);
  // 注意：NPC 列表为只读（来自全局 NPCInfo 表），此处不再绑定编辑/删除事件。
}

function bindBody(bodyId, getArr, numFields, boolFields) {
  const body = $(bodyId);
  const onEdit = e => {
    const t = e.target;
    if (t.dataset.i === undefined) return;
    const i = +t.dataset.i; const f = t.dataset.f;
    const arr = getArr(current);
    if (t.type === 'checkbox') arr[i][f] = t.checked;
    else if (numFields.includes(f)) arr[i][f] = parseInt(t.value, 10) || 0;
    else arr[i][f] = t.value;
    drawMap();
  };
  // 'input' 覆盖文本框/数字框，'change' 覆盖下拉框（select）
  body.addEventListener('input', onEdit);
  body.addEventListener('change', onEdit);
  body.addEventListener('click', e => {
    if (e.target.dataset.del !== undefined) {
      const i = +e.target.dataset.del;
      getArr(current).splice(i, 1);
      if (bodyId === 'szBody') renderSZ(); else if (bodyId === 'monBody') renderMon(); else renderMv();
      drawMap();
    }
  });
}

// ---- 怪物选择：点击按钮弹出滑动列表 ----
let pickerRow = -1;
const monPicker = $('monPicker');
// 面板水平居中于条目（按钮）中心 X，竖直贴在其下方（溢出则翻到上方）
function positionPicker(panel, anchor) {
  const r = anchor.getBoundingClientRect();
  const w = panel.offsetWidth || 360;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.bottom + 4;
  const ph = panel.offsetHeight || window.innerHeight * 0.7;
  if (top + ph > window.innerHeight) top = Math.max(8, r.top - ph - 4);
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}
function openMonPicker(i, anchor) {
  pickerRow = i;
  monPicker.innerHTML = '<div class="pick-head">选择怪物（共 ' + monsters.length + '）</div>' +
    '<div class="pick-search"><input class="pick-input" placeholder="搜索 id / 名称..." /><button class="pick-go">搜索</button></div>' +
    '<div class="pick-list"></div>';
  renderMonList('');
  positionPicker(monPicker, anchor);
  monPicker.classList.add('show');
}
function renderMonList(q) {
  q = (q || '').trim().toLowerCase();
  const list = monPicker.querySelector('.pick-list');
  const items = monsters.filter(m => !q || String(m.index).includes(q) || (m.name || '').toLowerCase().includes(q));
  list.innerHTML = items.length
    ? items.map(m => `<button class="pick-item" data-idx="${m.index}">${m.index} - ${m.name}${m.isBoss ? ' [Boss]' : ''}</button>`).join('')
    : '<div class="pick-empty">无匹配结果</div>';
}
function closeMonPicker() { monPicker.classList.remove('show'); pickerRow = -1; }

$('monBody').addEventListener('click', e => {
  const btn = e.target.closest('.monpick');
  if (btn) { openMonPicker(+btn.dataset.i, btn); e.stopPropagation(); }
});
monPicker.addEventListener('click', e => {
  const item = e.target.closest('.pick-item');
  if (!item) return;
  const idx = +item.dataset.idx;
  if (pickerRow >= 0) {
    current.respawns[pickerRow].monsterIndex = idx;
    renderMon();
    drawMap();
  }
  closeMonPicker();
});
monPicker.addEventListener('input', e => { if (e.target.classList.contains('pick-input')) renderMonList(e.target.value); });
monPicker.addEventListener('click', e => { if (e.target.classList.contains('pick-go')) renderMonList(monPicker.querySelector('.pick-input').value); });
document.addEventListener('click', e => {
  if (monPicker.classList.contains('show') && !monPicker.contains(e.target) && !e.target.closest('.monpick')) closeMonPicker();
});

function renderSZ() {
  const body = $('szBody');
  body.innerHTML = current.safeZones.map((z, i) =>
  `<tr>
    <td><input type="number" data-i="${i}" data-f="x" value="${z.x}"></td>
    <td><input type="number" data-i="${i}" data-f="y" value="${z.y}"></td>
    <td><input type="number" data-i="${i}" data-f="size" value="${z.size}"></td>
    <td><input type="number" data-i="${i}" data-f="sizeY" value="${z.sizeY || z.size}"></td>
    <td><input type="number" data-i="${i}" data-f="rotation" value="${z.rotation || 0}"></td>
    <td><input type="checkbox" data-i="${i}" data-f="start" ${z.start ? 'checked' : ''}></td>
    <td><button class="del" data-del="${i}">删</button></td>
  </tr>`).join('');
}

function renderMon() {
  const body = $('monBody');
  body.innerHTML = current.respawns.map((r, i) => {
    const mn = monsters.find(m => m.index === r.monsterIndex);
    const label = mn ? `${mn.index} - ${mn.name}${mn.isBoss ? ' [Boss]' : ''}` : `(未知: ${r.monsterIndex})`;
    return `<tr>
      <td><button class="monpick" data-i="${i}">${label} ▾</button></td>
      <td><input type="number" data-i="${i}" data-f="x" value="${r.x}"></td>
      <td><input type="number" data-i="${i}" data-f="y" value="${r.y}"></td>
      <td><input type="number" data-i="${i}" data-f="count" value="${r.count}"></td>
      <td><input type="number" data-i="${i}" data-f="spread" value="${r.spread}"></td>
      <td><input type="number" data-i="${i}" data-f="delay" value="${r.delay}"></td>
      <td><input type="number" data-i="${i}" data-f="direction" value="${r.direction}"></td>
      <td><button class="del" data-del="${i}">删</button></td>
    </tr>`;
  }).join('');
}

function renderNpc() {
  const body = $('npcBody');
  body.innerHTML = current.npcs.map((n, i) =>
    `<tr>
      <td>${n.index}</td>
      <td><input type="text" value="${n.fileName || ''}" disabled></td>
      <td><input type="text" value="${n.name || ''}" disabled></td>
      <td><input type="number" value="${n.x}" disabled></td>
      <td><input type="number" value="${n.y}" disabled></td>
      <td><input type="number" value="${n.rate}" disabled></td>
      <td><input type="number" value="${n.image}" disabled></td>
    </tr>`).join('');
}

// ---- 目标地图选择：Button + 居中滚动列表 ----
let mvPickerRow = -1;
const mvPicker = $('mvPicker');
function openMvPicker(i, anchor) {
  mvPickerRow = i;
  mvPicker.innerHTML = '<div class="pick-head">选择目标地图（共 ' + maps.length + '）</div>' +
    '<div class="pick-search"><input class="pick-input" placeholder="搜索 id / 名称..." /><button class="pick-go">搜索</button></div>' +
    '<div class="pick-list"></div>';
  renderMvList('');
  positionPicker(mvPicker, anchor);
  mvPicker.classList.add('show');
}
function renderMvList(q) {
  q = (q || '').trim().toLowerCase();
  const list = mvPicker.querySelector('.pick-list');
  const items = maps.filter(m => !q || String(m.index).includes(q) || (m.title || m.fileName || '').toLowerCase().includes(q));
  list.innerHTML = items.length
    ? items.map(m => `<button class="mv-item" data-idx="${m.index}">${m.index} - ${m.title || m.fileName}</button>`).join('')
    : '<div class="pick-empty">无匹配结果</div>';
}
function closeMvPicker() { mvPicker.classList.remove('show'); mvPickerRow = -1; }

$('mvBody').addEventListener('click', e => {
  const btn = e.target.closest('.mvpick');
  if (btn) { openMvPicker(+btn.dataset.i, btn); e.stopPropagation(); }
});
mvPicker.addEventListener('click', e => {
  const item = e.target.closest('.mv-item');
  if (!item) return;
  const idx = +item.dataset.idx;
  if (mvPickerRow >= 0) {
    current.movements[mvPickerRow].destMapIndex = idx;
    renderMv();
    drawMap();
  }
  closeMvPicker();
});
mvPicker.addEventListener('input', e => { if (e.target.classList.contains('pick-input')) renderMvList(e.target.value); });
mvPicker.addEventListener('click', e => { if (e.target.classList.contains('pick-go')) renderMvList(mvPicker.querySelector('.pick-input').value); });
document.addEventListener('click', e => {
  if (mvPicker.classList.contains('show') && !mvPicker.contains(e.target) && !e.target.closest('.mvpick')) closeMvPicker();
});

function renderMv() {
  const body = $('mvBody');
  body.innerHTML = current.movements.map((m, i) => {
    const mm = maps.find(x => x.index === m.destMapIndex);
    const label = mm ? `${m.destMapIndex} - ${mm.title || mm.fileName}` : `未知(${m.destMapIndex})`;
    return `<tr>
      <td><button class="mvpick" data-i="${i}">${label} ▾</button></td>
      <td><input type="number" data-i="${i}" data-f="sourceX" value="${m.sourceX}"></td>
      <td><input type="number" data-i="${i}" data-f="sourceY" value="${m.sourceY}"></td>
      <td><input type="number" data-i="${i}" data-f="destX" value="${m.destX}"></td>
      <td><input type="number" data-i="${i}" data-f="destY" value="${m.destY}"></td>
      <td><input type="checkbox" data-i="${i}" data-f="needHole" ${m.needHole ? 'checked' : ''}></td>
      <td><input type="checkbox" data-i="${i}" data-f="needMove" ${m.needMove ? 'checked' : ''}></td>
      <td><button class="del" data-del="${i}">删</button></td>
    </tr>`;
  }).join('');
}

function drawMap() {
  const c = $('canvas');
  const m = current && current.map;
  if (!m || !m.cols) { setStatus('无地图数据或无法解码'); return; }
  const cols = m.cols, rows = m.rows, cell = cellPx;
  // 离屏按像素绘制（高效）
  const off = document.createElement('canvas');
  off.width = cols; off.height = rows;
  const octx = off.getContext('2d');
  const img = octx.createImageData(cols, rows);
  const d = img.data;
  for (let i = 0; i < cols * rows; i++) {
    // 解码器每格存 1 字节的 nibble 值（0~15），直接取用即可，无需再拆高低位
    const nib = flags ? flags[i] : 0;
    const walk = (nib & 8) === 0;
    const safe = (nib & 2) !== 0;
    let r, g, bl;
    if (walk) { r = 235; g = 232; bl = 222; } else { r = 64; g = 64; bl = 64; }
    if (safe) { if (walk) { r = 200; g = 232; bl = 200; } else { r = 40; g = 80; bl = 40; } }
    const p = i * 4; d[p] = r; d[p + 1] = g; d[p + 2] = bl; d[p + 3] = 255;
  }
  octx.putImageData(img, 0, 0);

  c.width = cols * cell; c.height = rows * cell;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, c.width, c.height);

  // 安全区（支持矩形 + 旋转）：以中心点旋转绘制半宽/半高矩形
  const deg2rad = Math.PI / 180;
  current.safeZones.forEach(z => {
    const hw = z.size * cell;
    const hh = ((z.sizeY && z.sizeY > 0) ? z.sizeY : z.size) * cell;
    const cx = z.x * cell + cell / 2, cy = z.y * cell + cell / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((z.rotation || 0) * deg2rad);
    ctx.lineWidth = z.start ? 3 : 2;
    ctx.strokeStyle = z.start ? '#00ff00' : '#00cc00';
    ctx.strokeRect(-hw, -hh, 2 * hw, 2 * hh);
    ctx.restore();
  });
  // 怪物
  current.respawns.forEach(r => {
    const mn = monsters.find(m => m.index === r.monsterIndex);
    const boss = mn ? mn.isBoss : false;
    const cx = r.x * cell + cell / 2, cy = r.y * cell + cell / 2, rad = Math.max(3, cell * 0.45);
    if (boss) { ctx.lineWidth = 2; ctx.strokeStyle = '#1565ff'; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke(); }
    else { ctx.fillStyle = '#ff2222'; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill(); }
  });
  // NPC（绿点）
  current.npcs.forEach(n => {
    const cx = n.x * cell + cell / 2, cy = n.y * cell + cell / 2, rad = Math.max(3, cell * 0.45);
    ctx.fillStyle = '#00aa00'; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
  });
  // 传送点（橙色方块 = 源坐标）
  current.movements.forEach(mv => {
    const cx = mv.sourceX * cell + cell / 2, cy = mv.sourceY * cell + cell / 2, s = Math.max(3, cell * 0.6);
    ctx.fillStyle = '#ff9900'; ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
  });
  setStatus(`${current.title || current.fileName} (id=${current.index})  网格 ${cols}×${rows}  可走 ${m.walkable}`);
}

async function save() {
  if (!current) return;
  const g = current.general;
  g.title = $('g_title').value;
  g.fileName = $('g_fileName').value;
  g.miniMap = parseInt($('g_miniMap').value, 10) || 0;
  g.bigMap = parseInt($('g_bigMap').value, 10) || 0;
  g.music = parseInt($('g_music').value, 10) || 0;
  g.light = parseInt($('g_light').value, 10) || 0;
  g.noReconnectMap = $('g_noReconnectMap').value;
  BOOL_FIELDS.forEach(([k]) => { g[k] = $('g_' + k).checked; });

  // 注意：NPC 不在此处保存（NPC 属于全局 NPC 表，已通过独立接口增删改）
  const payload = {
    general: g,
    safeZones: current.safeZones,
    respawns: current.respawns.map(r => ({ monsterIndex: r.monsterIndex, x: r.x, y: r.y, count: r.count, spread: r.spread, delay: r.delay, direction: r.direction })),
    movements: current.movements.map(m => ({ destMapIndex: m.destMapIndex, sourceX: m.sourceX, sourceY: m.sourceY, destX: m.destX, destY: m.destY, needHole: m.needHole, needMove: m.needMove }))
  };
  setTb('保存中...');
  const res = await fetch('/api/maps/' + current.index, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  });
  if (res.ok) { setTb('已保存 ✅'); }
  else { setTb('保存失败: ' + (await res.text())); }
}

$('filter').addEventListener('input', e => renderList(e.target.value));
init();
</script>
