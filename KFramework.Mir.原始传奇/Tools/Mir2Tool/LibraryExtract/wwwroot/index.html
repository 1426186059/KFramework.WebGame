<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>传奇 Lib 导出工具 (LibraryExtract)</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">◈</span>
            <div>
                <h1>传奇 Lib 导出工具</h1>
                <p>LibraryExtract · .Lib → PNG + Placements + Bytes</p>
            </div>
        </div>
        <div class="top-status">
            <span id="stateBadge" class="badge badge-gray">就绪</span>
        </div>
    </header>

    <main class="layout">
        <section class="panel">
            <!-- 路径配置 -->
            <div class="card">
                <div class="card-title">路径配置</div>

                <div class="field">
                    <label>选择Lib文件</label>
                    <label class="check"><input type="radio" name="libMode" id="rbFile" value="file" /> 文件</label>
                    <label class="check"><input type="radio" name="libMode" id="rbFolder" value="folder" checked /> 文件夹</label>
                    <input id="libPath" type="text" placeholder=".Lib 文件或包含 .Lib 的文件夹" />
                    <button class="btn btn-ghost" data-browse="libPath">浏览</button>
                    <span id="dot-libPath" class="dot"></span>
                </div>

                <div class="field">
                    <label>输出文件夹</label>
                    <span class="spacer"></span>
                    <span class="spacer"></span>
                    <input id="outputFolder" type="text" placeholder="PNG / Placements / Bytes 的输出根目录" />
                    <button class="btn btn-ghost" data-browse="outputFolder">浏览</button>
                    <span id="dot-outputFolder" class="dot"></span>
                </div>

                <div class="row-actions">
                    <button id="btnSaveConfig" class="btn">保存配置</button>
                    <button id="btnScan" class="btn">扫描 .Lib 文件</button>
                    <span id="scanInfo" class="muted"></span>
                </div>

                <div id="scanListWrap" class="card nested hidden">
                    <div class="card-title small">待转换文件（最多显示 200 个）</div>
                    <div id="scanList" class="scan-list"></div>
                </div>
            </div>

            <!-- 转换 -->
            <div class="card">
                <div class="row-actions">
                    <button id="btnConvert" class="btn btn-primary">开始转换</button>
                    <button id="btnCancel" class="btn btn-danger" disabled>取消</button>
                    <span id="runInfo" class="muted"></span>
                </div>

                <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
                <div id="lblProgress" class="progress-text">就绪</div>

                <pre class="help">输出结构：
  {输出文件夹}/{Lib名}/{index}.png              每张图片
  {输出文件夹}/{Lib名}/Placements/{index}.txt   每行分别是 X、Y 偏移
  {输出文件夹}/Bytes/{Lib名}.bytes              仅元数据索引（13 字节/张）
文件夹模式会保持子目录相对结构。</pre>
            </div>
        </section>

        <aside class="panel side-panel">
            <div class="card grow">
                <div class="card-title">
                    日志
                    <button id="btnClearLog" class="btn btn-ghost btn-xs">清空</button>
                </div>
                <div id="log" class="log"></div>
            </div>
        </aside>
    </main>

    <!-- 目录浏览弹窗 -->
    <div id="browseModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <span id="browseTitle">选择目录</span>
                <button id="browseClose" class="btn btn-ghost btn-xs">✕</button>
            </div>
            <div class="modal-path" id="browsePath"></div>
            <div class="modal-toolbar">
                <button id="browseUp" class="btn btn-ghost">↑ 上级</button>
                <button id="browsePick" class="btn btn-primary">选择当前目录</button>
            </div>
            <div id="browseList" class="browse-list"></div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
