<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原始传奇 图集预览</title>
<style>
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #1b1b1b; color: #ddd; }
  header {
    position: sticky; top: 0; background: #262626; padding: 10px 14px; display: flex;
    flex-direction: column; gap: 8px; border-bottom: 1px solid #333; z-index: 10;
  }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input[type=text], button {
    background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 6px 8px;
  }
  #rootPath { flex: 1 1 360px; min-width: 240px; color: #9fd3ff; }
  #grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; align-content: flex-start; }
  .card { background: #2a2a2a; border: 1px solid #383838; border-radius: 6px; padding: 6px; width: fit-content; }
  .card canvas {
    display: block;
    background: repeating-conic-gradient(#3a3a3a 0% 25%, #2e2e2e 0% 50%) 50% / 16px 16px;
    image-rendering: pixelated;
  }
  .card .name { font-size: 11px; margin-top: 4px; word-break: break-all; max-width: 260px; color: #9fd3ff; }
  .card .dim { font-size: 10px; color: #888; }
  .empty { padding: 40px; color: #888; }
  .card .name { cursor: pointer; user-select: text; }
  .card .name:hover { text-decoration: underline; }
  .copy { color: #c9a06a; cursor: pointer; }
  .copy:hover { text-decoration: underline; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2e7d32; color: #fff; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; font-size: 13px; max-width: 80vw; word-break: break-all; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>原始传奇 图集预览</h1>
    <input id="rootPath" type="text" placeholder="把本地图集文件夹路径粘贴到这里，例如 D:\xxx\assets" />
    <button id="loadBtn">加载</button>
  </div>
  <div class="bar">
    <label>图集：
      <select id="atlasSelect"><option value="">（先粘贴路径并加载）</option></select>
    </label>
    <input id="atlasSearch" type="text" placeholder="模糊搜索图集名…（如 y_homeUI）" />
    <span id="atlasCount" style="color:#888"></span>
    <input id="filter" type="text" placeholder="模糊过滤帧名…" />
    <span id="count" style="color:#888"></span>
  </div>
  <div class="bar">
    <span>输出目录：</span>
    <input id="outDir" type="text" placeholder="默认本机下载目录，可粘贴自定义本机路径" style="flex:1 1 360px; min-width:240px; color:#9fd3ff;" />
    <button id="exportAllBtn" title="把“图集”下拉里当前选中的图集每一帧裁成独立 PNG，写到上方输出目录（默认下载目录，可自定义）">下载当前图集</button>
  </div>
  <div class="bar">
    <span id="exportStatus" style="color:#9fd3ff"></span>
    <span id="exportPath" class="copy" style="color:#9fd3ff; display:none" title="点击复制输出目录全路径"></span>
  </div>
  <div class="bar" id="atlasInfoBar" style="display:none">
    <span>当前选择的图集：</span><span id="atlasName" class="copy" title="点击复制图集名"></span>
  </div>
</header>

<div id="grid"><div class="empty">把本地图集文件夹路径粘贴到上方输入框，点“加载”，工具会遍历该目录下所有 *-sheet.json（含子目录）</div></div>

<div id="toast"></div>
<script>
const THUMB_H = 150; // 每个条目固定高度 150px
const grid = document.getElementById('grid');
const filterInput = document.getElementById('filter');
const countEl = document.getElementById('count');
const rootInput = document.getElementById('rootPath');
const loadBtn = document.getElementById('loadBtn');
const atlasSelect = document.getElementById('atlasSelect');
const atlasSearch = document.getElementById('atlasSearch');
const atlasCountEl = document.getElementById('atlasCount');

// 模糊匹配：query 各字符按出现顺序（可不连续）命中 text 即匹配；空 query 全匹配。
function fuzzyMatch(text, query) {
  text = (text || '').toLowerCase();
  query = (query || '').toLowerCase().trim();
  if (!query) return true;
  let ti = 0;
  for (const ch of query) {
    if (ti >= text.length) return false;
    const idx = text.indexOf(ch, ti);
    if (idx === -1) return false;
    ti = idx + 1;
  }
  return true;
}

// 按图集名模糊过滤下拉项（占位项始终显示），并显示匹配计数。
function filterAtlasOptions() {
  const q = atlasSearch.value;
  let visible = 0;
  for (const opt of atlasSelect.options) {
    if (opt.value === '') { opt.style.display = ''; continue; }
    const show = fuzzyMatch(opt.textContent, q);
    opt.style.display = show ? '' : 'none';
    if (show) visible++;
  }
  atlasCountEl.textContent = atlases.length ? ('匹配 ' + visible + ' / ' + atlases.length + ' 个图集') : '';
}
atlasSearch.addEventListener('input', filterAtlasOptions);
// 回车直接选中第一个匹配项
atlasSearch.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  for (const opt of atlasSelect.options) {
    if (opt.value !== '' && opt.style.display !== 'none') {
      atlasSelect.value = opt.value; atlasSelect.dispatchEvent(new Event('change')); break;
    }
  }
});

let atlases = [];
let currentRoot = '';
let currentFrames = [];
let currentImg = null;
let currentAtlasName = '';

// 粘贴路径 -> 服务端遍历列出图集
async function loadRoot() {
  const root = rootInput.value.trim();
  if (!root) { alert('请先粘贴图集文件夹路径'); return; }
  currentRoot = root;
  try {
    const res = await fetch('/api/atlases?root=' + encodeURIComponent(root));
    const data = await res.json();
    if (!res.ok) { grid.innerHTML = '<div class="empty">错误：' + (data.error || res.status) + '</div>'; return; }
    atlases = data.atlases || [];
    atlasSelect.innerHTML = '<option value="">— 选择图集 —</option>';
    atlases.forEach((a, i) => {
      const o = document.createElement('option'); o.value = i; o.textContent = a.name; atlasSelect.appendChild(o);
    });
    filterAtlasOptions();
    grid.innerHTML = atlases.length
      ? '<div class="empty">已发现 ' + atlases.length + ' 个图集，请从下拉选择</div>'
      : '<div class="empty">该路径下没找到 *-sheet.json</div>';
  } catch (e) { grid.innerHTML = '<div class="empty">请求失败：' + e + '</div>'; }
}
loadBtn.addEventListener('click', loadRoot);
rootInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadRoot(); });

// 选图集 -> 解析帧 + 加载同目录 png（pngUrl 已是 /api/atlasimage?...）
atlasSelect.addEventListener('change', async e => {
  const i = e.target.value;
  if (i === '' || i == null) return;
  const a = atlases[+i];
  currentAtlasName = a.name;
  // 顶部显示并支持复制当前图集名（去掉 .json 后缀的裸名，如 y_homeUI-sheet）
  const sheetKey = (a.name || '').replace(/\.json$/i, '');
  document.getElementById('atlasName').textContent = sheetKey;
  document.getElementById('atlasInfoBar').style.display = '';
  if (!a) return;
  try {
    const res = await fetch('/api/atlas?root=' + encodeURIComponent(currentRoot) + '&rel=' + encodeURIComponent(a.relPath));
    const data = await res.json();
    if (!res.ok) { grid.innerHTML = '<div class="empty">错误：' + (data.error || res.status) + '</div>'; return; }
    const frames = data.frames || [];
    if (!data.pngUrl) { grid.innerHTML = '<div class="empty">该图集没有 png 地址</div>'; return; }
    const img = new Image();
    img.onload = () => { currentImg = img; currentFrames = frames; render(); };
    img.onerror = () => alert('png 加载失败');
    img.src = data.pngUrl;
  } catch (e) { grid.innerHTML = '<div class="empty">请求失败：' + e + '</div>'; }
});

// 复制文本到剪贴板（localhost 为安全上下文可用 navigator.clipboard；否则降级到 textarea+execCommand），并弹提示。
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    showToast('已复制：' + text);
  } catch (err) { showToast('复制失败：' + err); }
}
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

function render() {
  const q = filterInput.value;
  const frames = currentFrames.filter(f => fuzzyMatch(f.name, q));
  countEl.textContent = frames.length + ' / ' + currentFrames.length + ' 帧';
  grid.innerHTML = '';
  if (!frames.length) { grid.innerHTML = '<div class="empty">无匹配帧</div>'; return; }
  const img = currentImg;
  for (const f of frames) {
    if (f.w <= 0 || f.h <= 0) continue;
    const cw = Math.max(1, Math.round(THUMB_H * (f.w / f.h)));
    const card = document.createElement('div');
    card.className = 'card';
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = THUMB_H;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false; // 像素清晰
    try { ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, cw, THUMB_H); } catch (e) {}
    const nm = document.createElement('div');
    nm.className = 'name'; nm.textContent = f.name; nm.title = '点击复制帧名';
    nm.addEventListener('click', () => copyText(f.name));
    const dm = document.createElement('div');
    dm.className = 'dim'; dm.textContent = f.w + '×' + f.h;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(dm);
    grid.appendChild(card);
  }
}
filterInput.addEventListener('input', render);

// ============ 导出当前图集：把每帧裁成独立 PNG，打成 ZIP 发给后端写到“输出目录” ============
// 输出目录由顶部输入框决定（默认本机下载目录，可自定义任意本机路径）。
// 前端纯 JS 打 ZIP（STORE 无压缩 + CRC32，零依赖），后端 /api/export 解压落盘。
const exportAllBtn = document.getElementById('exportAllBtn');
const exportStatus = document.getElementById('exportStatus');

function safeName(s) { return (s || 'frame').replace(/[\\/:*?"<>|]/g, '_'); }

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('png 加载失败: ' + src));
    img.src = src;
  });
}

// ---- 纯 JS ZIP 写出（STORE 无压缩 + CRC32，零依赖），用于把当前图集所有小图发给后端落盘 ----

// CRC32 表
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// 把 [{ name, data:Uint8Array }] 打包成 ZIP Blob（STORE，无压缩；PNG 本身已压缩，无妨）。
function makeZip(entries) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const e of entries) {
    const nameBytes = enc.encode(e.name);
    const data = e.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);   // 本地文件头签名
    dv.setUint16(4, 20, true);           // version needed
    dv.setUint16(6, 0, true);            // flags
    dv.setUint16(8, 0, true);            // method 0 = store
    dv.setUint16(10, 0, true);           // mod time
    dv.setUint16(12, 0, true);           // mod date
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);  // compressed size
    dv.setUint32(22, data.length, true);  // uncompressed size
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);           // extra len
    local.set(nameBytes, 30);
    chunks.push(local, data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cd.buffer);
    cdv.setUint32(0, 0x02014b50, true);  // 中央目录头签名
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);     // 本地文件头偏移
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + data.length;
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const centralOffset = offset;
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);    // 中央目录结束签名
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, entries.length, true);
  edv.setUint16(10, entries.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);

  return new Blob([...chunks, ...central, end], { type: 'application/zip' });
}

// 收集一个图集所有帧的 PNG 字节，返回 { sheetName, entries }
async function collectAtlasFrames(a) {
  const sheetName = safeName((a.name || 'atlas').replace(/\.json$/i, ''));
  let data;
  try {
    const res = await fetch('/api/atlas?root=' + encodeURIComponent(currentRoot) + '&rel=' + encodeURIComponent(a.relPath));
    data = await res.json();
  } catch (e) { throw new Error('图集解析失败：' + a.name); }
  const frames = data.frames || [];
  if (!data.pngUrl) return { sheetName, entries: [] };
  let img;
  try { img = await loadImage(data.pngUrl); }
  catch (e) { throw new Error('png 加载失败：' + a.name); }
  const entries = [];
  for (const f of frames) {
    if (f.w <= 0 || f.h <= 0) continue;
    const cv = document.createElement('canvas');
    cv.width = f.w; cv.height = f.h;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false; // 像素清晰，不插值
    try { ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h); }
    catch (e) { continue; }
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (!blob) continue;
    const buf = await blob.arrayBuffer();
    entries.push({ name: sheetName + '/' + safeName(f.name) + '.png', data: new Uint8Array(buf) });
  }
  return { sheetName, entries };
}

async function downloadAll() {
  if (!atlases.length) { alert('请先粘贴路径并“加载”图集'); return; }
  const sel = atlasSelect.value;
  if (sel === '' || sel == null) { alert('请先在“图集”下拉里选择一个图集'); return; }
  const a = atlases[+sel];
  let dir = (outDirInput.value || '').trim();
  if (!dir) dir = defaultDownload; // 输入框为空时退回默认下载目录
  if (!dir) { alert('请先填写输出目录（默认下载目录会自动填入）'); return; }
  exportStatus.textContent = '正在打包并写出当前图集：' + (a.name || '') + ' …';
  exportPath.style.display = 'none';
  try {
    const { sheetName, entries } = await collectAtlasFrames(a);
    if (!entries.length) { exportStatus.textContent = '该图集没有可导出的帧'; return; }
    const zipBlob = makeZip(entries);
    const fd = new FormData();
    fd.append('zip', zipBlob, sheetName + '.zip');
    const res = await fetch('/api/export?dir=' + encodeURIComponent(dir), { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) { exportStatus.textContent = '导出失败：' + (data.error || res.status); showToast('导出失败'); return; }
    const msg = '已完成：' + sheetName + '（' + entries.length + ' 张小图）';
    exportStatus.textContent = msg;
    exportPath.textContent = '输出目录：' + data.outDir;
    exportPath.style.display = '';
    showToast(msg);
  } catch (err) {
    exportStatus.textContent = '导出失败：' + err.message;
    showToast('导出失败：' + err.message);
  }
}
exportAllBtn.addEventListener('click', downloadAll);

// 输出目录输入框：默认填入本机“下载”目录（由后端 /api/defaultdownload 提供），用户可改为任意本机路径。
const outDirInput = document.getElementById('outDir');
const exportPath = document.getElementById('exportPath');
let defaultDownload = '';
fetch('/api/defaultdownload').then(r => r.json()).then(d => {
  if (d && d.path) { defaultDownload = d.path; if (!outDirInput.value) outDirInput.value = d.path; }
}).catch(() => {});
// 输出目录全路径可点击复制
exportPath.addEventListener('click', e => copyText(e.target.textContent.replace(/^输出目录：/, '')));
// 顶部「当前选择的图集」名称点击即可复制（裸名，如 y_homeUI-sheet）
document.getElementById('atlasName').addEventListener('click', e => copyText(e.target.textContent));
</script>
</body>
</html>
