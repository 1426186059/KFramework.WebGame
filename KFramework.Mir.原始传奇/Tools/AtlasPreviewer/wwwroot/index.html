<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原始传奇 图集预览</title>
<style>
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #1b1b1b; color: #ddd; }
  header {
    position: sticky; top: 0; background: #262626; padding: 10px 14px; display: flex;
    flex-direction: column; gap: 8px; border-bottom: 1px solid #333; z-index: 10;
  }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input[type=text], button {
    background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 6px 8px;
  }
  #rootPath { flex: 1 1 360px; min-width: 240px; color: #9fd3ff; }
  #grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; align-content: flex-start; }
  .card { background: #2a2a2a; border: 1px solid #383838; border-radius: 6px; padding: 6px; width: fit-content; }
  .card canvas {
    display: block;
    background: repeating-conic-gradient(#3a3a3a 0% 25%, #2e2e2e 0% 50%) 50% / 16px 16px;
    image-rendering: pixelated;
  }
  .card .name { font-size: 11px; margin-top: 4px; word-break: break-all; max-width: 260px; color: #9fd3ff; }
  .card .dim { font-size: 10px; color: #888; }
  .empty { padding: 40px; color: #888; }
  .card .name { cursor: pointer; user-select: text; }
  .card .name:hover { text-decoration: underline; }
  .copy { color: #c9a06a; cursor: pointer; }
  .copy:hover { text-decoration: underline; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2e7d32; color: #fff; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; font-size: 13px; max-width: 80vw; word-break: break-all; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>原始传奇 图集预览</h1>
    <input id="rootPath" type="text" placeholder="把本地图集文件夹路径粘贴到这里，例如 D:\xxx\assets" />
    <button id="loadBtn">加载</button>
  </div>
  <div class="bar">
    <label>图集：
      <select id="atlasSelect"><option value="">（先粘贴路径并加载）</option></select>
    </label>
    <input id="atlasSearch" type="text" placeholder="模糊搜索图集名…（如 y_homeUI）" />
    <span id="atlasCount" style="color:#888"></span>
    <input id="filter" type="text" placeholder="模糊过滤帧名…" />
    <span id="count" style="color:#888"></span>
  </div>
  <div class="bar" id="atlasInfoBar" style="display:none">
    <span>当前选择的图集：</span><span id="atlasName" class="copy" title="点击复制图集名"></span>
  </div>
</header>

<div id="grid"><div class="empty">把本地图集文件夹路径粘贴到上方输入框，点“加载”，工具会遍历该目录下所有 *-sheet.json（含子目录）</div></div>

<div id="toast"></div>
<script>
const THUMB_H = 150; // 每个条目固定高度 150px
const grid = document.getElementById('grid');
const filterInput = document.getElementById('filter');
const countEl = document.getElementById('count');
const rootInput = document.getElementById('rootPath');
const loadBtn = document.getElementById('loadBtn');
const atlasSelect = document.getElementById('atlasSelect');
const atlasSearch = document.getElementById('atlasSearch');
const atlasCountEl = document.getElementById('atlasCount');

// 模糊匹配：query 各字符按出现顺序（可不连续）命中 text 即匹配；空 query 全匹配。
function fuzzyMatch(text, query) {
  text = (text || '').toLowerCase();
  query = (query || '').toLowerCase().trim();
  if (!query) return true;
  let ti = 0;
  for (const ch of query) {
    if (ti >= text.length) return false;
    const idx = text.indexOf(ch, ti);
    if (idx === -1) return false;
    ti = idx + 1;
  }
  return true;
}

// 按图集名模糊过滤下拉项（占位项始终显示），并显示匹配计数。
function filterAtlasOptions() {
  const q = atlasSearch.value;
  let visible = 0;
  for (const opt of atlasSelect.options) {
    if (opt.value === '') { opt.style.display = ''; continue; }
    const show = fuzzyMatch(opt.textContent, q);
    opt.style.display = show ? '' : 'none';
    if (show) visible++;
  }
  atlasCountEl.textContent = atlases.length ? ('匹配 ' + visible + ' / ' + atlases.length + ' 个图集') : '';
}
atlasSearch.addEventListener('input', filterAtlasOptions);
// 回车直接选中第一个匹配项
atlasSearch.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  for (const opt of atlasSelect.options) {
    if (opt.value !== '' && opt.style.display !== 'none') {
      atlasSelect.value = opt.value; atlasSelect.dispatchEvent(new Event('change')); break;
    }
  }
});

let atlases = [];
let currentRoot = '';
let currentFrames = [];
let currentImg = null;
let currentAtlasName = '';

// 粘贴路径 -> 服务端遍历列出图集
async function loadRoot() {
  const root = rootInput.value.trim();
  if (!root) { alert('请先粘贴图集文件夹路径'); return; }
  currentRoot = root;
  try {
    const res = await fetch('/api/atlases?root=' + encodeURIComponent(root));
    const data = await res.json();
    if (!res.ok) { grid.innerHTML = '<div class="empty">错误：' + (data.error || res.status) + '</div>'; return; }
    atlases = data.atlases || [];
    atlasSelect.innerHTML = '<option value="">— 选择图集 —</option>';
    atlases.forEach((a, i) => {
      const o = document.createElement('option'); o.value = i; o.textContent = a.name; atlasSelect.appendChild(o);
    });
    filterAtlasOptions();
    grid.innerHTML = atlases.length
      ? '<div class="empty">已发现 ' + atlases.length + ' 个图集，请从下拉选择</div>'
      : '<div class="empty">该路径下没找到 *-sheet.json</div>';
  } catch (e) { grid.innerHTML = '<div class="empty">请求失败：' + e + '</div>'; }
}
loadBtn.addEventListener('click', loadRoot);
rootInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadRoot(); });

// 选图集 -> 解析帧 + 加载同目录 png（pngUrl 已是 /api/atlasimage?...）
atlasSelect.addEventListener('change', async e => {
  const i = e.target.value;
  if (i === '' || i == null) return;
  const a = atlases[+i];
  currentAtlasName = a.name;
  // 顶部显示并支持复制当前图集名（去掉 .json 后缀的裸名，如 y_homeUI-sheet）
  const sheetKey = (a.name || '').replace(/\.json$/i, '');
  document.getElementById('atlasName').textContent = sheetKey;
  document.getElementById('atlasInfoBar').style.display = '';
  if (!a) return;
  try {
    const res = await fetch('/api/atlas?root=' + encodeURIComponent(currentRoot) + '&rel=' + encodeURIComponent(a.relPath));
    const data = await res.json();
    if (!res.ok) { grid.innerHTML = '<div class="empty">错误：' + (data.error || res.status) + '</div>'; return; }
    const frames = data.frames || [];
    if (!data.pngUrl) { grid.innerHTML = '<div class="empty">该图集没有 png 地址</div>'; return; }
    const img = new Image();
    img.onload = () => { currentImg = img; currentFrames = frames; render(); };
    img.onerror = () => alert('png 加载失败');
    img.src = data.pngUrl;
  } catch (e) { grid.innerHTML = '<div class="empty">请求失败：' + e + '</div>'; }
});

// 复制文本到剪贴板（localhost 为安全上下文可用 navigator.clipboard；否则降级到 textarea+execCommand），并弹提示。
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    showToast('已复制：' + text);
  } catch (err) { showToast('复制失败：' + err); }
}
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

function render() {
  const q = filterInput.value;
  const frames = currentFrames.filter(f => fuzzyMatch(f.name, q));
  countEl.textContent = frames.length + ' / ' + currentFrames.length + ' 帧';
  grid.innerHTML = '';
  if (!frames.length) { grid.innerHTML = '<div class="empty">无匹配帧</div>'; return; }
  const img = currentImg;
  for (const f of frames) {
    if (f.w <= 0 || f.h <= 0) continue;
    const cw = Math.max(1, Math.round(THUMB_H * (f.w / f.h)));
    const card = document.createElement('div');
    card.className = 'card';
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = THUMB_H;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false; // 像素清晰
    try { ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, cw, THUMB_H); } catch (e) {}
    const nm = document.createElement('div');
    nm.className = 'name'; nm.textContent = f.name; nm.title = '点击复制帧名';
    nm.addEventListener('click', () => copyText(f.name));
    const dm = document.createElement('div');
    dm.className = 'dim'; dm.textContent = f.w + '×' + f.h;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(dm);
    grid.appendChild(card);
  }
}
filterInput.addEventListener('input', render);
// 顶部「当前选择的图集」名称点击即可复制（裸名，如 y_homeUI-sheet）
document.getElementById('atlasName').addEventListener('click', e => copyText(e.target.textContent));
</script>
</body>
</html>
