<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>.NET 10 + WebAssembly + WebGPU 2D 游戏引擎</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: radial-gradient(ellipse at center, #1a2332 0%, #0b0e14 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    canvas#game {
      display: block;
      background: #10141c;
      border-radius: 10px;
      box-shadow: 0 0 60px rgba(88, 166, 255, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    #loading {
      position: fixed;
      color: #8b949e;
      font-size: 15px;
      letter-spacing: 0.12em;
      max-width: 80vw;
      text-align: center;
      word-break: break-all;
    }
  </style>

  <!-- 首条错误可见性：在 main.js 执行前就捕获异常，避免永久转圈。 -->
  <script>
    (function () {
      const loadingEl = () => document.getElementById('loading');
      const show = (msg) => {
        const el = loadingEl();
        if (el) {
          el.textContent = msg;
          el.style.color = '#ff6b6b';
          el.style.letterSpacing = '0';
          el.style.lineHeight = '1.6';
        }
        console.error('[BootError]', msg);
      };
      window.onerror = (msg, url, line, col, err) => {
        show('JS错误: ' + msg + ' @ ' + (url || '?') + ':' + line + ':' + col
          + (err && err.stack ? '\n' + err.stack : ''));
      };
      window.addEventListener('unhandledrejection', (e) => {
        const reason = (e && e.reason) ? (e.reason.stack || String(e.reason)) : String(e);
        show('未处理Promise异常: ' + reason);
      });
      // 18s 超时兜底：如果还显示 loading，提示用户检查浏览器版本
      setTimeout(() => {
        const el = loadingEl();
        if (el && el.isConnected) {
          const cur = el.textContent || '';
          if (!cur.includes('错误') && !cur.includes('失败') && !cur.includes('JS错误')) {
            el.textContent = '启动超时：请确认使用 Chrome 113+/Edge 113+ 并开启硬件加速，或打开 F12 查看 Console 首条错误';
            el.style.color = '#ff9f43';
            el.style.letterSpacing = '0';
          }
        }
      }, 18000);
    })();
  </script>

  <script type='module' src="jsengine/main.js"></script>
</head>

<body>
  <canvas id="game"></canvas>
  <div id="loading">正在启动 .NET 游戏引擎…</div>
</body>

</html>
