<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Defender</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 21,11 26,24 16,29 6,24 11,11' fill='%2338bdf8'/%3E%3C/svg%3E">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type='module' src="main#[.{fingerprint}].js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #cbd5f5;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      letter-spacing: 2px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="boot">正在启动 .NET 运行时…</div>
</body>

</html>
