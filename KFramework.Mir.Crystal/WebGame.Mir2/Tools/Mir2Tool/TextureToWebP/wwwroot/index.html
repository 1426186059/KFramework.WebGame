<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片转 WebP (TextureToWebP)</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">◈</span>
            <div>
                <h1>图片转 WebP</h1>
                <p>TextureToWebP · 递归遍历子目录，批量转为 WebP</p>
            </div>
        </div>
        <div class="top-status">
            <span id="stateBadge" class="badge badge-gray">就绪</span>
        </div>
    </header>

    <main class="layout">
        <section class="panel">
            <div class="card">
                <div class="card-title">转换设置</div>

                <div class="field">
                    <label>源文件夹</label>
                    <span class="spacer"></span>
                    <span class="spacer"></span>
                    <input id="sourceFolder" type="text" placeholder="要转换的文件夹（会遍历其所有子目录）" />
                    <button class="btn btn-ghost" data-browse="sourceFolder">浏览</button>
                    <span id="dot-sourceFolder" class="dot"></span>
                </div>

                <div class="field">
                    <label>输出文件夹</label>
                    <span class="spacer"></span>
                    <span class="spacer"></span>
                    <input id="outputFolder" type="text" placeholder="留空 = 在源文件同目录生成 .webp" />
                    <button class="btn btn-ghost" data-browse="outputFolder">浏览</button>
                    <span id="dot-outputFolder" class="dot"></span>
                </div>

                <div class="field">
                    <label>质量 (1-100)</label>
                    <span class="spacer"></span>
                    <span class="spacer"></span>
                    <input id="quality" type="text" placeholder="80" />
                    <span class="spacer"></span>
                    <span id="dot-quality" class="dot"></span>
                </div>

                <div class="field">
                    <label>扩展名</label>
                    <span class="spacer"></span>
                    <span class="spacer"></span>
                    <input id="extensions" type="text" placeholder=".png,.jpg,.jpeg,.bmp,.gif" />
                    <span class="spacer"></span>
                    <span id="dot-extensions" class="dot"></span>
                </div>

                <div class="row-actions">
                    <label class="check" title="无损 WebP：像素 100% 还原，避免有损压缩的振铃/透明边失真（推荐）">
                        <input id="lossless" type="checkbox" /> 无损
                    </label>
                    <label class="check"><input id="recursive" type="checkbox" /> 包含所有子目录</label>
                    <label class="check"><input id="overwrite" type="checkbox" /> 覆盖已存在</label>
                    <label class="check"><input id="deleteSource" type="checkbox" /> 转换后删除源文件</label>
                </div>

                <div class="row-actions">
                    <button id="btnSaveConfig" class="btn">保存设置</button>
                    <button id="btnScan" class="btn">扫描图片</button>
                    <span id="scanInfo" class="muted"></span>
                </div>

                <div id="scanListWrap" class="card nested hidden">
                    <div class="card-title small">待转换文件（最多显示 300 个）</div>
                    <div id="scanList" class="scan-list"></div>
                </div>
            </div>

            <div class="card">
                <div class="row-actions">
                    <button id="btnConvert" class="btn btn-primary">开始转换</button>
                    <button id="btnCancel" class="btn btn-danger" disabled>取消</button>
                    <span id="runInfo" class="muted"></span>
                </div>

                <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
                <div id="lblProgress" class="progress-text">就绪</div>

                <div id="sizeInfo" class="muted small"></div>
            </div>
        </section>

        <aside class="panel side-panel">
            <div class="card grow">
                <div class="card-title">
                    日志
                    <button id="btnClearLog" class="btn btn-ghost btn-xs">清空</button>
                </div>
                <div id="log" class="log"></div>
            </div>
        </aside>
    </main>

    <!-- 目录浏览弹窗 -->
    <div id="browseModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <span id="browseTitle">选择目录</span>
                <button id="browseClose" class="btn btn-ghost btn-xs">✕</button>
            </div>
            <div class="modal-path" id="browsePath"></div>
            <div class="modal-toolbar">
                <button id="browseUp" class="btn btn-ghost">↑ 上级</button>
                <button id="browsePick" class="btn btn-primary">选择当前目录</button>
            </div>
            <div id="browseList" class="browse-list"></div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
